    <!--
      tapndine homepage, "Orders reach the waiter, sorted by guest": the waiter's
      phone and the cocoa Table 1 card, on a see-through background. It replaces
      the static phone and card in that section; the butter circle stays HTML.

      Canvas 1350x1620 = the section's picture box (420 CSS px wide) at 2.5x,
      placed at (150, 100) with margin around it. #guide is a still of the real
      section, for previewing only; the page loads this file with ?embed.

      Loop: Bea, Paolo and Mia each send their order (the hero's orange blob)
      into the waiter's phone, where it lands as that guest's own card and the
      totals go up. Then the waiter clears the table (the app's own confirm
      box) and it starts again. Every screen piece is a real capture of the
      sample restaurant (assets/screens/); UI coordinates are the app's CSS px.
    -->
    <style>

      #guide { position: absolute; left: 0; top: 0; width: 1350px; height: 1620px; }
      .embed #guide { display: none; }

      /* the waiter's phone, where the page's phone sits (right 62% of the box) */
      #rig { position: absolute; left: 549px; top: 100px; width: 344px; height: 749px; transform-origin: 0 0; transform: scale(1.8925); }
      .phone { position: absolute; left: 0; top: 0; width: 344px; height: 749px; }
      .phone .shadow { position: absolute; left: 34px; top: 70px; width: 290px; height: 680px; border-radius: 70px; background: rgba(59, 46, 37, 0.42); filter: blur(28px); }

      .card { position: absolute; left: 14px; width: 362px; display: block; }
      .glow { position: absolute; left: 14px; width: 362px; border-radius: 26px; box-shadow: 0 0 0 4px #f19a33, 0 0 30px 6px rgba(241, 154, 51, 0.7); opacity: 0; }

      .touch { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.35) 60%, rgba(255, 255, 255, 0.15)); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6), 0 4px 14px rgba(0, 0, 0, 0.35); opacity: 0; z-index: 40; }
      .tring { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.9); opacity: 0; z-index: 40; }

      /* the guests at the table, each on their own phone */
      .guest {
        position: absolute; left: 160px; width: 340px; height: 124px; z-index: 5;
        display: flex; align-items: center; gap: 22px; padding: 0 30px 0 18px; border-radius: 62px;

      #tcard .stack { display: grid; }
      #tcard .stack > span { grid-area: 1 / 1; opacity: 0; }

      #tcard .l2 { margin-top: 10px; font-size: 35px; line-height: 1.43; color: rgba(255, 255, 255, 0.75); }

      #tcard .l4 { margin-top: 10px; font-size: 30px; line-height: 1.33; color: rgba(255, 255, 255, 0.6); }

      /* an order on its way: the hero's blob, with a bag and the item count */
      .blob { position: absolute; left: 0; top: 0; width: 132px; height: 132px; margin: -66px 0 0 -66px; z-index: 60; opacity: 0; }
      .blob .shape { position: absolute; inset: 0; filter: drop-shadow(0 14px 18px rgba(59, 46, 37, 0.35)); }
      .blob svg.b { position: absolute; inset: -8px; width: 148px; height: 148px; }
      .blob .bag { position: absolute; left: 42px; top: 38px; width: 48px; height: 52px; }
      .blob .count { position: absolute; left: 76px; top: 22px; width: 36px; height: 36px; border-radius: 50%; background: #f1b52e; border: 3px solid #fff; color: #3b2e25; font-size: 19px; font-weight: 800; line-height: 30px; text-align: center; }

    <script>
      if (location.hash === "#embed" || new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
      gsap.registerPlugin(MotionPathPlugin);
      const tl = gsap.timeline({ paused: true });

      // an app point (CSS px, below the status bar) -> canvas px
      const R = 1.8925, U = 0.8205;
      const cx = (ux) => 549 + (12 + ux * U) * R;
      const cy = (uy) => 100 + (12 + (40 + uy) * U) * R;

      gsap.set(["#c-bea", "#c-paolo", "#c-mia"], { opacity: 0, scale: 0.9 });
      gsap.set(".blob", { x: 0, y: 0, scale: 0, opacity: 0 });

      function tap(x, y, at) {
        tl.set("#touch", { left: x, top: y, scale: 1.25, opacity: 0 }, at - 0.3);
        tl.set("#tring", { left: x, top: y, scale: 1, opacity: 0 }, at - 0.3);
        tl.to("#touch", { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, at - 0.28);
        tl.to("#touch", { scale: 0.82, duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1 }, at);
        tl.fromTo("#tring", { scale: 1, opacity: 0.9 }, { scale: 2.4, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, at);
        tl.to("#touch", { opacity: 0, duration: 0.25, ease: "power1.out" }, at + 0.22);
      }

      // the table card's three lines move to state n
      function card(n, prev, at) {
        tl.to(`#a${prev}, #b${prev}`, { opacity: 0, y: -14, duration: 0.25, ease: "power2.in" }, at);
        tl.fromTo(`#a${n}, #b${n}`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, at + 0.2);
        tl.to(`#f${prev}`, { opacity: 0, duration: 0.2, ease: "none" }, at + 0.2);
        tl.to(`#f${n}`, { opacity: 1, duration: 0.2, ease: "none" }, at + 0.15);
      }

      // one guest sends: their chip pulses, the blob pops out and arcs into the
      // phone, landing where their card appears (ux, uy in app px)
      function send(who, ux, uy, at) {
        const sx = 470, sy = parseFloat(document.getElementById(`u-${who}`).style.top) + 62;
        const ex = cx(ux), ey = cy(uy);
        const midx = (sx + ex) / 2, topy = Math.min(sy, ey) - 230;
        tl.to(`#u-${who}`, { scale: 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, at);
        tl.fromTo(`#o-${who}`, { x: sx, y: sy, scale: 0, opacity: 1 }, { x: sx, y: sy, scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, at + 0.15);
        tl.to(`#o-${who}`, { duration: 0.8, ease: "power1.inOut", motionPath: { path: [{ x: sx, y: sy }, { x: midx, y: topy }, { x: ex, y: ey }], curviness: 1.2 } }, at + 0.45);
        tl.fromTo(`#o-${who} .shape`, { scaleX: 1, scaleY: 1, rotation: 0 }, { scaleX: 1.12, scaleY: 0.9, rotation: 8, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, at + 0.45);
        tl.to(`#o-${who} .shape`, { scaleX: 1.35, scaleY: 0.6, rotation: 0, duration: 0.12, ease: "power2.out" }, at + 1.25);
        tl.to(`#o-${who}`, { scale: 0.3, opacity: 0, duration: 0.25, ease: "power2.in" }, at + 1.33);
        // the card appears where it landed, glowing
        tl.to(`#c-${who}`, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, at + 1.33);
        tl.to(`#g-${who}`, { opacity: 1, duration: 0.25, ease: "power2.out" }, at + 1.45);
        tl.to(`#g-${who}`, { opacity: 0, duration: 0.7, ease: "power2.in" }, at + 2.0);
      }

      // 0.5  Bea
      send("bea", 195, 300, 0.5);
      tl.to("#c-empty", { opacity: 0, scale: 0.95, duration: 0.3, ease: "power2.in" }, 1.55);
      tl.to("#c-add", { y: 315.5, duration: 0.5, ease: "power3.inOut" }, 1.5);
      card(1, 0, 1.85);
      tl.to("#d0", { opacity: 0, duration: 0.25 }, 1.85);
      tl.to("#d1", { opacity: 1, duration: 0.35 }, 2.05);

      // 2.9  Paolo (the list scrolls to make room)
      tl.to("#list", { y: -110, duration: 0.6, ease: "power2.inOut" }, 3.55);
      send("paolo", 195, 578.5, 2.9);
      tl.to("#c-add", { y: 651.5, duration: 0.5, ease: "power3.inOut" }, 3.9);
      card(2, 1, 4.25);

      // 5.3  Mia
      tl.to("#list", { y: -370, duration: 0.7, ease: "power2.inOut" }, 5.9);
      send("mia", 195, 619, 5.3);
      tl.to("#c-add", { y: 918.5, duration: 0.5, ease: "power3.inOut" }, 6.3);
      card(3, 2, 6.65);

      // 8.1  the bill is paid: Clear table (paid) -> the app's confirm box -> Clear table
      tap(298.7, 806, 8.1);
      tl.to("#dim", { opacity: 1, duration: 0.25, ease: "power1.out" }, 8.25);
      tl.fromTo("#dialog", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.5)", immediateRender: false }, 8.25);
      tap(195, 459, 9.1);
      tl.to("#dialog", { opacity: 0, scale: 0.96, duration: 0.2, ease: "power2.in" }, 9.3);
      tl.to("#dim", { opacity: 0, duration: 0.3, ease: "power1.in" }, 9.35);
      tl.to(["#c-bea", "#c-paolo", "#c-mia"], { opacity: 0, duration: 0.3, ease: "power1.in" }, 9.35);
      tl.set(["#c-bea", "#c-paolo", "#c-mia"], { scale: 0.9 }, 9.7);
      tl.to("#list", { y: 0, duration: 0.01 }, 9.66);
      tl.set("#c-add", { y: 0 }, 9.66);
      tl.to("#c-empty", { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 9.7);
      tl.fromTo("#c-add", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, 9.7);
      card(0, 3, 9.6);
      tl.to("#d1", { opacity: 0, duration: 0.25 }, 9.6);
      tl.to("#d0", { opacity: 1, duration: 0.35 }, 9.8);

      // On the homepage (?embed): scale the canvas to the frame, then play while
      // it is on screen (looping). Reduced motion gets one still frame (7.5s).
      // HyperFrames' own runtime never sets ?embed, so Studio and renders skip this.
      window.__timelines = window.__timelines || {};
      if (document.documentElement.classList.contains("embed")) {
        const root = document.getElementById("root");
        const fit = () => {
          document.body.style.transformOrigin = "0 0";
          document.body.style.transform = `scale(${innerWidth / Number(root.dataset.width)})`;
        };
        fit();
        addEventListener("resize", fit);
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          tl.seek(7.5);
        } else {
          // hold for the rest of the root duration, then go again
          tl.repeat(-1).repeatDelay(Math.max(0, Number(root.dataset.duration) - tl.duration()));
          let started = false;
          new IntersectionObserver(([e]) => {
            if (e.isIntersecting) { tl.play(); started = true; }
            else if (true && started) tl.pause();
          }).observe(document.documentElement);
        }
      }

      window.__timelines["main"] = tl;
    </script>
