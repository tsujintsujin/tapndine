<!doctype html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <!--
      tappetite homepage hero: one table with tappetite, no waiting. He taps the
      table stand, the Pork Sisig card answers the questions (photo, spice, how
      many it feeds, price), Add, and the order goes to the waiter; the kitchen
      cooks, the waiter brings it, they eat. Loops; see-through, so the hero's
      own background shows. Same flat art and layers as videos/wait-race
      (source/parts.py there), the table drawn 1.55x bigger (.stage).

      On the homepage (#embed) it scales to its frame and loops while on
      screen; reduced motion shows one still (2.2 s, the card up).
    -->
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root { --ink: #233862; --orange: #f19a33; --cocoa: #3b2e25; --price: #b8650f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Montserrat", sans-serif; color: var(--ink); }

      /* the table at the wait-race scale (500x357 px), drawn 1.55x */
      .stage { position: absolute; left: 152px; top: 446px; width: 500px; height: 357px; transform: scale(1.55); transform-origin: 0 0; }
      .scene { position: absolute; left: 0; top: 0; width: 500px; height: 357px; }
      .scene > img, .armw { position: absolute; left: 0; top: 0; width: 500px; height: 357px; display: block; }
      .armw img { position: absolute; left: 0; top: 0; width: 500px; height: 357px; display: block; }
      .waiter { position: absolute; left: 0; top: -71px; width: 200px; height: 428px; }
      .waiter img { position: absolute; left: 0; top: 0; width: 200px; height: 428px; display: block; }
      #shadow { position: absolute; left: -20px; top: 346px; width: 600px; height: 22px; border-radius: 50%; background: rgba(35, 56, 98, 0.16); }
      .phone { position: absolute; width: 16px; height: 26px; border-radius: 4px; background: #1b2a4a; }
      .phone::after { content: ""; position: absolute; left: 2px; top: 3px; right: 2px; bottom: 4px; border-radius: 2px; background: #d6e6fd; }
      #tent { position: absolute; left: 240px; top: 141px; width: 26px; height: 34px; }
      .ring { position: absolute; left: 238px; top: 137px; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--orange); opacity: 0; }
      .plate { position: absolute; width: 96px; height: 44px; }
      .plate svg.p { position: absolute; left: 0; top: 0; width: 96px; height: 44px; }
      .steam { position: absolute; left: 22px; top: -40px; width: 52px; height: 44px; }
      .steam path { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; opacity: 0; }

      /* the dish card, the order and the kitchen, at canvas scale */
      #card { position: absolute; left: 200px; top: 70px; width: 640px; padding: 24px; border-radius: 36px; background: #fff; display: flex; gap: 24px; box-shadow: 0 30px 60px -24px rgba(35, 56, 98, 0.5); opacity: 0; }
      #card::after { content: ""; position: absolute; left: 404px; bottom: -22px; border: 20px solid transparent; border-top: 22px solid #fff; border-bottom: 0; }
      #card .ph { flex: none; width: 210px; height: 210px; border-radius: 24px; object-fit: cover; display: block; }
      #card .info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
      #card .nm { font-size: 44px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
      #card .row { display: flex; align-items: center; gap: 10px; font-size: 34px; font-weight: 700; white-space: nowrap; }
      #card .chili { width: 26px; height: 36px; }
      #card .buy { display: flex; align-items: center; justify-content: space-between; }
      #card .price { font-size: 44px; font-weight: 800; color: var(--price); }
      #card .add { position: relative; width: 188px; height: 64px; border-radius: 32px; background: var(--orange); color: var(--cocoa); font-size: 34px; font-weight: 800; }
      #card .add span { position: absolute; inset: 0; display: grid; place-items: center; white-space: nowrap; }
      #card .add .done { opacity: 0; }
      .chipw { position: absolute; left: 50%; top: 170px; transform: translateX(-50%); }
      .chip { display: flex; align-items: center; gap: 16px; padding: 18px 34px 18px 22px; border-radius: 44px; background: #fff; box-shadow: 0 18px 40px -18px rgba(35, 56, 98, 0.5); font-size: 38px; font-weight: 800; white-space: nowrap; opacity: 0; }
      .chip .tick { width: 48px; height: 48px; border-radius: 50%; background: #85a55e; display: grid; place-items: center; }
      .chip .tick svg { width: 28px; height: 28px; }
      .chip .pan { position: relative; width: 72px; height: 62px; }
      .chip .pan svg.b { position: absolute; left: 0; bottom: 0; width: 72px; height: 30px; }
      .chip .steam { left: 12px; top: -12px; width: 44px; height: 38px; }
      .chip .steam path { stroke: #8cb4f4; stroke-width: 3.5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.6" data-width="1080" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="8.6" data-track-index="0" style="position: absolute; inset: 0">
        <div class="stage">
          <div id="shadow"></div>
          <div class="scene">
            <img src="assets/art/c-back.svg" alt="" />
            <div class="waiter" id="waiter">
              <img src="assets/art/w-legR.svg" alt="" id="wlegR" />
              <img src="assets/art/w-legL.svg" alt="" id="wlegL" />
              <img src="assets/art/w-back.svg" alt="" />
              <img src="assets/art/w-head.svg" alt="" />
              <img src="assets/art/w-body.svg" alt="" />
              <img src="assets/art/w-hands.svg" alt="" />
            </div>
            <img src="assets/art/c-wchair.svg" alt="" />
            <img src="assets/art/c-wbody1.svg" alt="" />
            <img src="assets/art/c-whead.svg" alt="" id="whead" />
            <img src="assets/art/c-wbody2.svg" alt="" />
            <img src="assets/art/c-table.svg" alt="" />
            <img src="assets/art/c-mbody1.svg" alt="" />
            <img src="assets/art/c-mhead.svg" alt="" id="mhead" />
            <img src="assets/art/c-mbody2.svg" alt="" />
            <div class="armw" id="armw">
              <img src="assets/art/c-marm.svg" alt="" />
              <div class="phone" id="phone" style="left: 258px; top: 86px"></div>
            </div>
            <img src="assets/art/c-mcollar.svg" alt="" />
            <img src="assets/art/c-mchair.svg" alt="" />
            <img src="assets/art/c-props.svg" alt="" />
            <img src="assets/art/c-weye.svg" alt="" id="weye" />
            <svg id="tent" viewBox="0 0 26 34" aria-hidden="true"><path d="M4 34 L9 0 H17 L22 34 Z" fill="#3b2e25" /><path d="M8.5 15 a6 6 0 0 1 9 0" stroke="#f19a33" stroke-width="2.4" fill="none" stroke-linecap="round" /><circle cx="13" cy="20" r="2.2" fill="#f19a33" /></svg>
            <div class="ring" id="ring1"></div>
            <div class="ring" id="ring2"></div>
            <div class="plate" id="plate" style="left: -11px; top: 41px">
              <svg class="p" viewBox="0 0 96 44"><ellipse cx="48" cy="34" rx="46" ry="9" fill="#a0332d" /><ellipse cx="48" cy="29" rx="38" ry="9" fill="#233862" /><ellipse cx="48" cy="24" rx="28" ry="8" fill="#c8743a" /><circle cx="36" cy="22" r="3" fill="#7a3b1f" /><circle cx="60" cy="25" r="3" fill="#f99746" /><circle cx="48" cy="20" r="8" fill="#fff" /><circle cx="48" cy="20" r="4.5" fill="#ffb93e" /></svg>
              <svg class="steam" viewBox="0 0 52 44"><path class="w1" d="M12 40 C4 30 20 22 12 8" /><path class="w2" d="M26 40 C18 30 34 22 26 6" /><path class="w3" d="M40 40 C32 30 48 22 40 8" /></svg>
            </div>
          </div>
        </div>

        <div id="card">
          <img class="ph" src="assets/photos/pork-sisig.webp" alt="" />
          <div class="info">
            <div class="nm">Pork Sisig</div>
            <div class="row" id="row-spice">
              <svg class="chili" viewBox="0 0 22 30"><path d="M11 6c6 3 7 12 1 22-2 1-3 0-3-2 1-7-3-12-2-17 1-2 2-3 4-3z" fill="#e0533d" /><path d="M11 7c0-3 2-5 4-6" stroke="#85a55e" stroke-width="3" fill="none" stroke-linecap="round" /></svg>
              <svg class="chili" viewBox="0 0 22 30"><path d="M11 6c6 3 7 12 1 22-2 1-3 0-3-2 1-7-3-12-2-17 1-2 2-3 4-3z" fill="#e0533d" /><path d="M11 7c0-3 2-5 4-6" stroke="#85a55e" stroke-width="3" fill="none" stroke-linecap="round" /></svg>
              <svg class="chili" viewBox="0 0 22 30"><path d="M11 6c6 3 7 12 1 22-2 1-3 0-3-2 1-7-3-12-2-17 1-2 2-3 4-3z" fill="#e0533d" /><path d="M11 7c0-3 2-5 4-6" stroke="#85a55e" stroke-width="3" fill="none" stroke-linecap="round" /></svg>
              <span>Spicy</span>
            </div>
            <div class="row" id="row-feeds">Feeds 2–3</div>
            <div class="buy"><span class="price" id="row-price">₱320</span><div class="add" id="add"><span>+ Add</span><span class="done">Added</span></div></div>
          </div>
        </div>
        <div class="chipw">
          <div class="chip" id="sent">
            <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></span>
            <span>Sent to the waiter</span>
          </div>
        </div>
        <div class="chipw">
          <div class="chip" id="cook">
            <div class="pan">
              <svg class="steam" viewBox="0 0 52 44"><path class="w1" d="M12 40 C4 30 20 22 12 8" /><path class="w2" d="M26 40 C18 30 34 22 26 6" /><path class="w3" d="M40 40 C32 30 48 22 40 8" /></svg>
              <svg class="b" viewBox="0 0 58 24"><path d="M2 6 H44 Q44 22 23 22 Q2 22 2 6 Z" fill="#233862" /><path d="M42 9 H57" stroke="#233862" stroke-width="5" stroke-linecap="round" /></svg>
            </div>
            <span>The kitchen is cooking</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      if (location.hash === "#embed" || new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
      const tl = gsap.timeline({ paused: true });

      // pivots, in scene px (as in videos/wait-race)
      gsap.set(["#whead", "#weye"], { transformOrigin: "78px 86px" });
      gsap.set("#mhead", { transformOrigin: "398px 78px" });
      gsap.set("#armw", { transformOrigin: "398px 100px" });
      gsap.set("#wlegL", { transformOrigin: "69px 207px" });
      gsap.set("#wlegR", { transformOrigin: "106px 207px" });
      gsap.set(["#waiter", "#plate"], { x: 640 }); // past the right edge at 1.55x
      gsap.set("#phone", { scale: 0, transformOrigin: "50% 100%" });
      gsap.set("#card", { scale: 0.7, transformOrigin: "65% 100%" });
      gsap.set([".chip"], { scale: 0.6 });

      function walk(rig, legs, from, to, t, dur, carried = []) {
        tl.fromTo([rig, ...carried], { x: from }, { x: to, duration: dur, ease: "power1.inOut", immediateRender: false }, t);
        const n = Math.max(2, Math.round(dur / 0.22));
        for (let i = 0; i < n; i++) {
          const a = i % 2 ? -14 : 14;
          tl.to(legs[0], { rotation: a, duration: dur / n, ease: "sine.inOut" }, t + (i * dur) / n);
          tl.to(legs[1], { rotation: -a, duration: dur / n, ease: "sine.inOut" }, t + (i * dur) / n);
        }
        tl.to(legs, { rotation: 0, duration: 0.14, ease: "sine.out" }, t + dur);
      }
      function steam(scope, t, dur) {
        ["w1", "w2", "w3"].forEach((w, i) => {
          const reps = Math.floor((dur - i * 0.3) / 1.2);
          tl.fromTo(`${scope} .${w}`, { opacity: 0, y: 8 }, { keyframes: [{ opacity: 0.95, y: 0, duration: 0.4 }, { opacity: 0, y: -12, duration: 0.8 }], ease: "none", repeat: reps, immediateRender: false }, t + i * 0.3);
        });
      }
      function sway(target, a, t, each, n) {
        tl.to(target, { rotation: a, duration: each, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1 }, t);
      }

      // 0.2  he taps the table stand
      tl.to("#phone", { scale: 1, duration: 0.25, ease: "back.out(2)" }, 0.2);
      tl.to("#armw", { rotation: -12, duration: 0.35, ease: "power2.inOut" }, 0.25);
      tl.to(["#whead", "#weye"], { rotation: 5, duration: 0.4, ease: "power2.inOut" }, 0.3);
      tl.to("#mhead", { rotation: -5, duration: 0.4, ease: "power2.inOut" }, 0.3);
      tl.fromTo("#ring1", { scale: 0.6, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, 0.6);
      tl.fromTo("#ring2", { scale: 0.6, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, 0.75);
      tl.to("#armw", { rotation: 4, duration: 0.35, ease: "power2.inOut" }, 0.85);

      // 1.0  the dish answers the questions before anyone asks
      tl.to("#card", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 1.0);
      ["#card .ph", "#row-spice", "#row-feeds", "#row-price"].forEach((sel, i) => {
        tl.fromTo(sel, { scale: 1 }, { scale: 1.07, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "0% 50%", immediateRender: false }, 1.6 + i * 0.3);
      });
      tl.to("#add", { scale: 0.9, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, 3.0);
      tl.to("#add span:first-child", { opacity: 0, duration: 0.06 }, 3.03);
      tl.to("#add .done", { opacity: 1, duration: 0.06 }, 3.03);
      // the order goes off to the waiter, out of frame
      tl.to("#card", { x: 520, y: 140, scale: 0.2, opacity: 0, duration: 0.4, ease: "power2.in" }, 3.3);
      tl.to("#sent", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 3.6);
      tl.to("#armw", { rotation: 0, duration: 0.4, ease: "power2.inOut" }, 3.6);
      tl.to("#phone", { scale: 0, duration: 0.2, ease: "power2.in" }, 3.8);
      tl.to(["#whead", "#weye", "#mhead"], { rotation: 0, duration: 0.4, ease: "power2.inOut" }, 3.7);

      // 4.7  the kitchen is cooking; they talk
      tl.to("#sent", { opacity: 0, scale: 0.8, duration: 0.2, ease: "power2.in" }, 4.7);
      tl.to("#cook", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 4.85);
      steam("#cook", 5.0, 1.7);
      sway(["#whead", "#weye"], 5, 4.9, 0.35, 2);
      sway("#armw", 9, 5.0, 0.3, 2);

      // 5.8  the food arrives
      walk("#waiter", ["#wlegL", "#wlegR"], 640, 145, 5.8, 0.7, ["#plate"]);
      tl.to("#plate", { x: 123, y: 94, duration: 0.35, ease: "power2.inOut" }, 6.55);
      tl.to("#cook", { opacity: 0, scale: 0.8, duration: 0.2, ease: "power2.in" }, 6.7);
      walk("#waiter", ["#wlegL", "#wlegR"], 145, 640, 7.0, 0.75);
      steam("#plate", 6.9, 1.7);
      sway("#armw", -9, 7.1, 0.3, 2);
      sway(["#whead", "#weye"], 6, 7.2, 0.3, 2);
      tl.set({}, {}, 8.6);

      window.__timelines = window.__timelines || {};
      if (document.documentElement.classList.contains("embed")) {
        const root = document.getElementById("root");
        const fit = () => {
          document.body.style.transformOrigin = "0 0";
          document.body.style.transform = `scale(${innerWidth / Number(root.dataset.width)})`;
        };
        fit();
        addEventListener("resize", fit);
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          tl.seek(2.2);
        } else {
          tl.repeat(-1);
          let started = false;
          new IntersectionObserver(([e]) => {
            if (e.isIntersecting) { tl.play(); started = true; }
            else if (started) tl.pause();
          }).observe(document.documentElement);
        }
      }
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
