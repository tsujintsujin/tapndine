    <!--
      tappetite homepage, "Your whole menu, on every phone at the table": a thick
      paper menu flips through its pages, shuts, and turns into one phone that
      scrolls the whole menu and taps Seafood. Plays once and holds the phone.

      Canvas 1300x1550 = the section's picture box (420x520 CSS px) at 2.5x,
      placed at (125, 125). #guide is a still of the real section (butter blob,
      doodles), for previewing only; the page loads this file with ?embed.
      The paper pages carry the sample restaurant's real dishes and prices
      (pages.json, from seed/dev.sql); the phone screens are real captures.
    -->
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1300px; height: 1550px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Montserrat", sans-serif; }
      #guide { position: absolute; left: 0; top: 0; width: 1300px; height: 1550px; }
      .embed #guide { display: none; }

      /* ---------- the paper menu ---------- */
      #bookstage { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 650px 500px; }
      #book { position: absolute; left: 180px; top: 380px; width: 940px; height: 700px; transform-style: preserve-3d; }
      #book-shadow { position: absolute; left: 200px; top: 420px; width: 920px; height: 690px; border-radius: 20px; background: rgba(59, 46, 37, 0.45); filter: blur(34px); }
      .half { position: absolute; top: 0; width: 470px; height: 700px; transform-style: preserve-3d; }
      #lstack { left: 0; transform-origin: 100% 50%; }
      #rstack { left: 470px; }
      .leaf { position: absolute; left: 470px; top: 0; width: 470px; height: 700px; transform-origin: 0 50%; transform-style: preserve-3d; }
      .face { position: absolute; inset: 0; backface-visibility: hidden; overflow: hidden; }
      .back { transform: rotateY(180deg); }
      .paper {
        background-color: #f6eedd;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0.22 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
        color: #3a2b20; font-family: Georgia, "Times New Roman", serif; padding: 46px 42px 40px;
      }
      /* the gutter darkens toward the spine */
      .paper.l::after, .paper.r::after { content: ""; position: absolute; top: 0; bottom: 0; width: 70px; pointer-events: none; }
      .paper.l::after { right: 0; background: linear-gradient(90deg, transparent, rgba(80, 55, 30, 0.22)); }
      .paper.r::after { left: 0; background: linear-gradient(270deg, transparent, rgba(80, 55, 30, 0.22)); }
      .pg-cat { font-size: 40px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; text-align: center; border-bottom: 2px solid #3a2b20; padding-bottom: 12px; }
      .pg-cat small { display: block; font-size: 15px; letter-spacing: 6px; font-weight: 400; margin-top: 6px; opacity: 0.7; }
      .it { margin-top: 26px; }
      .it .row { display: flex; align-items: baseline; gap: 8px; font-size: 27px; font-weight: 700; }
      .it .row .dots { flex: 1; border-bottom: 2.5px dotted rgba(58, 43, 32, 0.55); }
      .it .sub { font-size: 19px; font-style: italic; margin-top: 4px; opacity: 0.8; }
      .it .desc { font-size: 18px; line-height: 1.42; margin-top: 6px; opacity: 0.85; }
      .pg-no { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 16px; opacity: 0.6; }
      .title { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 100%; }
      .title .big { font-size: 96px; font-weight: 700; letter-spacing: 6px; }
      .title .rule { width: 180px; border-top: 2px solid #3a2b20; margin: 22px 0; }
      .title .small { font-size: 22px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.75; line-height: 1.7; max-width: 340px; }
      .stain { position: absolute; border-radius: 50%; pointer-events: none; mix-blend-mode: multiply; }
      /* page edges: the menu is thick */
      .edges-r { position: absolute; left: 0; top: 0; width: 470px; height: 700px; box-shadow: 3px 3px 0 #ede3cc, 6px 6px 0 #e4d7bb, 9px 8px 0 #dccdaa, 12px 10px 0 #d2c19c, 15px 12px 0 #c9b68f; }
      .edges-l { position: absolute; left: 0; top: 0; width: 470px; height: 700px; box-shadow: -3px 3px 0 #ede3cc, -6px 6px 0 #e4d7bb, -9px 8px 0 #dccdaa, -12px 10px 0 #d2c19c, -15px 12px 0 #c9b68f; }
      .cover {
        background: radial-gradient(130% 90% at 30% 20%, #5a463a 0%, #3b2e25 55%, #2c221b 100%);

      }
      .cover .frame { position: absolute; inset: 26px; border: 2px solid rgba(217, 179, 106, 0.6); border-radius: 6px; }
      .cover .big { font-size: 92px; font-weight: 700; letter-spacing: 8px; }
      .cover .small { font-size: 20px; letter-spacing: 6px; text-transform: uppercase; margin-top: 10px; opacity: 0.85; }

      .edge { position: absolute; inset: 0; border-radius: 62px; padding: 3px; background: linear-gradient(140deg, #8d857c 0%, #3a3632 22%, #1b1917 50%, #4a453f 78%, #9a9188 100%); }
      .bezel { width: 100%; height: 100%; border-radius: 59px; padding: 9px; background: #050505; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); }

      .btn { position: absolute; width: 4px; border-radius: 2px; background: linear-gradient(90deg, #2a2724, #6d665f); }
      .glare { position: absolute; inset: 0; border-radius: 50px; pointer-events: none; background: linear-gradient(115deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.04) 28%, transparent 42%, transparent 70%, rgba(255, 255, 255, 0.05) 100%); }

      .layer { position: absolute; left: 0; top: 0; width: 390px; display: block; }

      // HyperFrames' own runtime never sets ?embed, so Studio and renders skip this.
      window.__timelines = window.__timelines || {};
      if (document.documentElement.classList.contains("embed")) {
        const root = document.getElementById("root");
        const fit = () => {
          document.body.style.transformOrigin = "0 0";
          document.body.style.transform = `scale(${innerWidth / Number(root.dataset.width)})`;
        };
        fit();
        addEventListener("resize", fit);
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          tl.seek(7.5);
        } else {
          // plays once, then holds its last frame
          let started = false;
          new IntersectionObserver(([e]) => {
            if (e.isIntersecting) { tl.play(); started = true; }

        }
      }
