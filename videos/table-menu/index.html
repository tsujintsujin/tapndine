<!doctype html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <!--
      tapndine homepage, "Every question, answered on the dish": the
      three-person table from Justin's stock art. They share one paper menu
      and each has a question nobody at the table can answer. The menu goes;
      each has the menu on their own phone, and the dish card over each of
      them answers their own question (spice, how many it feeds, what it looks
      like). Then the paper menu is back and it starts again. See-through
      background. Layers: videos/wait-race/source/parts.py (TRIO). Dishes,
      photos and prices are the sample restaurant's.

      On the homepage (#embed) it scales to its frame and loops while on
      screen; reduced motion shows one still (5.2 s, the three cards up).
    -->
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root { --ink: #233862; --orange: #f19a33; --cocoa: #3b2e25; --price: #b8650f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Montserrat", sans-serif; color: var(--ink); }

      /* the table: 790x445 of the source at 0.886 = 700x394 */
      .trio { position: absolute; left: 190px; top: 610px; width: 700px; height: 394px; }
      .trio > img { position: absolute; left: 0; top: 0; width: 700px; height: 394px; display: block; }
      #shadow { position: absolute; left: 150px; top: 994px; width: 780px; height: 22px; border-radius: 50%; background: rgba(35, 56, 98, 0.16); }
      .phone { position: absolute; width: 20px; height: 32px; border-radius: 5px; background: #1b2a4a; }
      .phone::after { content: ""; position: absolute; left: 2.5px; top: 4px; right: 2.5px; bottom: 5px; border-radius: 2px; background: #d6e6fd; }

      .bub { position: absolute; padding: 16px 26px; border-radius: 28px; background: #fff; font-size: 34px; font-weight: 800; white-space: nowrap; box-shadow: 0 14px 30px -14px rgba(35, 56, 98, 0.45); opacity: 0; }
      .bub::after { content: ""; position: absolute; bottom: -16px; border: 12px solid transparent; border-top: 16px solid #fff; border-bottom: 0; }
      .bub.tl::after { left: 36px; }
      .bub.tc::after { left: calc(50% - 12px); }
      .bub.tr::after { right: 36px; }

      /* a dish card over each guest, answering their question */
      .card { position: absolute; width: 330px; padding: 16px; border-radius: 28px; background: #fff; box-shadow: 0 26px 50px -22px rgba(35, 56, 98, 0.55); opacity: 0; }
      .card::after { content: ""; position: absolute; bottom: -18px; border: 16px solid transparent; border-top: 18px solid #fff; border-bottom: 0; }
      .card .ph { width: 298px; height: 150px; border-radius: 18px; object-fit: cover; display: block; }
      .card .nm { margin-top: 12px; font-size: 32px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
      .card .row { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 28px; font-weight: 700; white-space: nowrap; }
      .card .chili { width: 20px; height: 28px; }
      .card .price { margin-top: 8px; font-size: 32px; font-weight: 800; color: var(--price); }
      .card .hl { position: relative; padding: 2px 10px; margin-left: -10px; border-radius: 12px; }
      .card .hl::before { content: ""; position: absolute; inset: 0; border-radius: 12px; background: #fad68a; opacity: var(--hl, 0); z-index: -1; }
      .card .ring { position: absolute; left: 12px; top: 12px; width: 306px; height: 158px; border-radius: 20px; box-shadow: 0 0 0 5px #f19a33; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.4" data-width="1080" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="8.4" data-track-index="0" style="position: absolute; inset: 0">
        <div id="shadow"></div>
        <div class="trio">
          <img src="assets/art/t-cchair.svg" alt="" />
          <img src="assets/art/t-chairb.svg" alt="" class="bea-head" />
          <img src="assets/art/t-clegs.svg" alt="" />
          <img src="assets/art/t-cface.svg" alt="" class="bea-head" />
          <img src="assets/art/t-cbody.svg" alt="" />
          <img src="assets/art/t-cmenu.svg" alt="" id="menu" />
          <img src="assets/art/t-chand.svg" alt="" />
          <img src="assets/art/t-chair.svg" alt="" class="bea-head" />
          <img src="assets/art/t-chand2.svg" alt="" />
          <img src="assets/art/t-lchair.svg" alt="" />
          <img src="assets/art/t-rchair.svg" alt="" />
          <img src="assets/art/t-rdrink.svg" alt="" />
          <img src="assets/art/t-rarm0.svg" alt="" />
          <img src="assets/art/t-rhairb.svg" alt="" class="mia-head" />
          <img src="assets/art/t-rlegs.svg" alt="" />
          <img src="assets/art/t-rneck.svg" alt="" />
          <img src="assets/art/t-rbody.svg" alt="" />
          <img src="assets/art/t-rface.svg" alt="" class="mia-head" />
          <img src="assets/art/t-rarms.svg" alt="" />
          <img src="assets/art/t-ldrink.svg" alt="" />
          <img src="assets/art/t-lbody1.svg" alt="" />
          <img src="assets/art/t-lneck.svg" alt="" />
          <img src="assets/art/t-lbody1b.svg" alt="" />
          <img src="assets/art/t-lface.svg" alt="" id="paolo-head" />
          <img src="assets/art/t-lbody2.svg" alt="" />
          <img src="assets/art/t-table.svg" alt="" />
          <div class="phone" id="ph-paolo" style="left: 176px; top: 150px"></div>
          <div class="phone" id="ph-bea" style="left: 330px; top: 150px"></div>
          <div class="phone" id="ph-mia" style="left: 520px; top: 158px"></div>
        </div>

        <!-- the questions, with one paper menu between three -->
        <div class="bub tl" id="q-paolo" style="left: 70px; top: 520px">Is it spicy?</div>
        <div class="bub tc" id="q-bea" style="left: 360px; top: 420px">How big is it?</div>
        <div class="bub tr" id="q-mia" style="left: 590px; top: 520px">What does it look like?</div>

        <!-- each one's answer, on their own phone -->
        <div class="card" id="c-paolo" style="left: 40px; top: 250px">
          <img class="ph" src="assets/photos/pork-sisig.webp" alt="" />
          <div class="nm">Pork Sisig</div>
          <div class="row"><span class="hl row" id="hl-paolo">
            <svg class="chili" viewBox="0 0 22 30"><path d="M11 6c6 3 7 12 1 22-2 1-3 0-3-2 1-7-3-12-2-17 1-2 2-3 4-3z" fill="#e0533d" /><path d="M11 7c0-3 2-5 4-6" stroke="#85a55e" stroke-width="3" fill="none" stroke-linecap="round" /></svg>
            <svg class="chili" viewBox="0 0 22 30"><path d="M11 6c6 3 7 12 1 22-2 1-3 0-3-2 1-7-3-12-2-17 1-2 2-3 4-3z" fill="#e0533d" /><path d="M11 7c0-3 2-5 4-6" stroke="#85a55e" stroke-width="3" fill="none" stroke-linecap="round" /></svg>
            <svg class="chili" viewBox="0 0 22 30"><path d="M11 6c6 3 7 12 1 22-2 1-3 0-3-2 1-7-3-12-2-17 1-2 2-3 4-3z" fill="#e0533d" /><path d="M11 7c0-3 2-5 4-6" stroke="#85a55e" stroke-width="3" fill="none" stroke-linecap="round" /></svg>
            Spicy</span></div>
          <div class="price">₱320</div>
        </div>
        <div class="card" id="c-bea" style="left: 375px; top: 130px">
          <img class="ph" src="assets/photos/kare-kare.webp" alt="" />
          <div class="nm">Kare-Kare</div>
          <div class="row"><span class="hl" id="hl-bea">Feeds 2–4</span></div>
          <div class="price">₱495</div>
        </div>
        <div class="card" id="c-mia" style="left: 710px; top: 250px">
          <img class="ph" src="assets/photos/chicken-inasal.webp" alt="" />
          <div class="ring" id="hl-mia"></div>
          <div class="nm">Chicken Inasal</div>
          <div class="row">Not spicy</div>
          <div class="price">₱245</div>
        </div>
      </div>
    </div>

    <script>
      if (location.hash === "#embed" || new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
      const tl = gsap.timeline({ paused: true });

      // pivots, in trio px: (source - [190, 1100]) x 0.886
      gsap.set("#paolo-head", { transformOrigin: "93px 102px" });
      gsap.set(".bea-head", { transformOrigin: "310px 93px" });
      gsap.set(".mia-head", { transformOrigin: "623px 102px" });
      gsap.set("#menu", { transformOrigin: "358px 170px" });
      gsap.set(".trio .phone", { scale: 0, transformOrigin: "50% 100%" });
      gsap.set(".bub", { scale: 0.6 });
      gsap.set("#q-paolo", { transformOrigin: "12% 120%" });
      gsap.set("#q-bea", { transformOrigin: "50% 120%" });
      gsap.set("#q-mia", { transformOrigin: "88% 120%" });
      // each card's tail points down at its guest
      gsap.set("#c-paolo", { transformOrigin: "60% 110%", rotation: -2, scale: 0.6 });
      gsap.set("#c-bea", { transformOrigin: "38% 110%", rotation: 1.5, scale: 0.6 });
      gsap.set("#c-mia", { transformOrigin: "30% 110%", rotation: -1.5, scale: 0.6 });

      // 0.3  one menu, three heads leaning in
      tl.to("#paolo-head", { rotation: 6, duration: 0.45, ease: "power2.inOut" }, 0.3);
      tl.to(".mia-head", { rotation: -6, duration: 0.45, ease: "power2.inOut" }, 0.35);
      tl.to(".bea-head", { rotation: 5, duration: 0.45, ease: "power2.inOut" }, 0.4);
      // the questions nobody at the table can answer
      tl.to("#q-paolo", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 0.6);
      tl.to("#q-bea", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 1.1);
      tl.to("#q-mia", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 1.6);
      tl.to(".bub", { opacity: 0, scale: 0.85, duration: 0.2, ease: "power2.in", stagger: 0.06 }, 2.9);

      // 3.1  the paper menu goes; everyone has it on their own phone
      tl.to("#menu", { scale: 0, rotation: -20, duration: 0.3, ease: "back.in(1.6)" }, 3.1);
      tl.to(".trio .phone", { scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.1 }, 3.3);
      tl.to(["#paolo-head", ".bea-head", ".mia-head"], { rotation: (i) => [-4, 6, 5][i] ?? 5, duration: 0.4, ease: "power2.inOut" }, 3.3);
      tl.to("#c-paolo", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 3.5);
      tl.to("#c-bea", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 3.7);
      tl.to("#c-mia", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 3.9);
      // each card answers its own question
      tl.to("#hl-paolo", { "--hl": 1, duration: 0.3, ease: "power1.out" }, 4.4);
      tl.to("#hl-bea", { "--hl": 1, duration: 0.3, ease: "power1.out" }, 4.7);
      tl.to("#hl-mia", { opacity: 1, duration: 0.3, ease: "power1.out" }, 5.0);
      tl.to("#paolo-head", { rotation: -8, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.5);
      tl.to(".bea-head", { rotation: 9, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.8);
      tl.to(".mia-head", { rotation: 8, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.1);

      // 7.2  back to the paper menu, for the loop
      tl.to(".card", { opacity: 0, scale: 0.8, duration: 0.25, ease: "power2.in", stagger: 0.06 }, 7.2);
      tl.to(".trio .phone", { scale: 0, duration: 0.2, ease: "power2.in" }, 7.4);
      tl.set(["#hl-paolo", "#hl-bea"], { "--hl": 0 }, 7.6);
      tl.set("#hl-mia", { opacity: 0 }, 7.6);
      tl.to("#menu", { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(1.6)" }, 7.6);
      tl.to(["#paolo-head", ".bea-head", ".mia-head"], { rotation: 0, duration: 0.4, ease: "power2.inOut" }, 7.6);
      tl.set({}, {}, 8.4);

      window.__timelines = window.__timelines || {};
      if (document.documentElement.classList.contains("embed")) {
        const root = document.getElementById("root");
        const fit = () => {
          document.body.style.transformOrigin = "0 0";
          document.body.style.transform = `scale(${innerWidth / Number(root.dataset.width)})`;
        };
        fit();
        addEventListener("resize", fit);
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          tl.seek(5.4);
        } else {
          tl.repeat(-1);
          let started = false;
          new IntersectionObserver(([e]) => {
            if (e.isIntersecting) { tl.play(); started = true; }
            else if (started) tl.pause();
          }).observe(document.documentElement);
        }
      }
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
