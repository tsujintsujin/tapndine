    <!--
      tappetite homepage hero: the phone (and its tap tag) in the hero's right
      column, on a see-through background. It drops into the page where the
      static phone was; the plate, orange circle and price badge stay HTML.

      Canvas 1400x1200. The hero's square picture box (520 CSS px on desktop)
      is the 1080x1080 area at (200, 60); the margin lets phones move past the
      box edge without being cut off. #guide is a still of the real hero behind
      it, for previewing only; the page loads this file with ?embed and the
      guide is hidden.

      One dinner, looping: Mia taps the tag, the menu opens, she adds two
      dishes and sends them; her phone slides away, the waiter's phone slides
      in, gets the order, goes dark and settles where Mia's phone started.
      Every screen is a real capture of the sample restaurant (assets/screens/).
      UI layers inside .ui use the app's own CSS pixels (390 wide), so tap
      positions are the captured element boxes.
    -->
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1400px; height: 1200px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Montserrat", sans-serif; }
      #guide { position: absolute; left: 0; top: 0; width: 1400px; height: 1200px; }
      .embed #guide { display: none; }

      /* The phone rig: the page's phone box (left 12%, bottom 0, 40% wide of the
         1080 box), in phone-sized units. Tag and phones share it so the guest
         phone can pass over the tag while tapping and under it otherwise. */
      #rig {
        position: absolute; left: 329.6px; top: 199px; width: 344px; height: 749px;
        transform-origin: 0 0; transform: scale(1.256); perspective: 1600px;
      }

      /* ---------- the NFC tag (same look and spot as the page's) ---------- */
      #tag-wrap { position: absolute; left: -103.2px; top: 181.5px; width: 159.2px; height: 159.2px; z-index: 2; }
      #tag {
        position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 36% 30%, #4b3b2f 0%, #3b2e25 55%, #30251e 100%);
        border: 6.6px solid #fff;
        box-shadow: 0 16px 30px -8px rgba(59, 46, 37, 0.55), inset 0 2px 2px rgba(255, 236, 210, 0.25);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      #tag .t1 { font-size: 29.5px; font-weight: 800; line-height: 1; color: #fad68a; }
      #tag .t2 { margin-top: 3px; font-size: 13.3px; font-weight: 600; line-height: 1.2; text-align: center; color: rgba(255, 255, 255, 0.8); }
      #tag-glow {
        position: absolute; inset: -26px; border-radius: 50%;
        background: radial-gradient(circle, rgba(241, 154, 51, 0.55), transparent 65%);
        opacity: 0;
      }
      .ring { position: absolute; left: 0; top: 0; width: 159.2px; height: 159.2px; border-radius: 50%; border: 3.5px solid #f19a33; opacity: 0; }

      /* ---------- phones ---------- */
      .phone { position: absolute; left: 0; top: 0; width: 344px; height: 749px; transform-style: preserve-3d; z-index: 1; }
      .phone .shadow {
        position: absolute; left: 34px; top: 70px; width: 290px; height: 680px; border-radius: 70px;
        background: rgba(59, 46, 37, 0.42); filter: blur(28px);
      }
      .edge {
        position: absolute; inset: 0; border-radius: 62px; padding: 3px;
        background: linear-gradient(140deg, #8d857c 0%, #3a3632 22%, #1b1917 50%, #4a453f 78%, #9a9188 100%);
      }
      .bezel { width: 100%; height: 100%; border-radius: 59px; padding: 9px; background: #050505; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); }
      .screen { position: relative; width: 320px; height: 725px; border-radius: 50px; overflow: hidden; background: #f5f6f2; }
      .btn { position: absolute; width: 4px; border-radius: 2px; background: linear-gradient(90deg, #2a2724, #6d665f); }
      .glare {
        position: absolute; inset: 0; border-radius: 50px; pointer-events: none;
        background: linear-gradient(115deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.04) 28%, transparent 42%, transparent 70%, rgba(255, 255, 255, 0.05) 100%);
      }
      .island { position: absolute; left: 50%; top: 11px; width: 100px; height: 29px; margin-left: -50px; border-radius: 15px; background: #000; z-index: 20; }

      /* the app's own coordinate space: 390 x 884 (40 status bar + 844 viewport) */
      .ui { position: absolute; left: 0; top: 0; width: 390px; height: 884px; transform-origin: 0 0; transform: scale(0.8205); overflow: hidden; }
      .status { position: absolute; left: 0; top: 0; width: 390px; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 40px; font: 600 15px "Montserrat", sans-serif; z-index: 15; }
      .status .icons { display: flex; gap: 6px; align-items: center; }
      .vp { position: absolute; left: 0; top: 40px; width: 390px; height: 844px; overflow: hidden; }
      .layer { position: absolute; left: 0; top: 0; width: 390px; }
      .layer img, img.layer { display: block; width: 390px; }
      /* phone at rest: the tappetite logo on cocoa, not a black screen */
      .off { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: radial-gradient(120% 75% at 30% 12%, #54423a 0%, #3b2e25 55%, #2c221b 100%); }
      .off .logo { width: 236px; height: auto; display: block; }

      .touch {
        position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.35) 60%, rgba(255, 255, 255, 0.15));
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6), 0 4px 14px rgba(0, 0, 0, 0.35);
        opacity: 0; z-index: 40;
      }
      .tring { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.9); opacity: 0; z-index: 40; }
      #mia-glow { position: absolute; left: 14px; width: 362px; height: 255px; border-radius: 26px; box-shadow: 0 0 0 4px #f19a33, 0 0 30px 6px rgba(241, 154, 51, 0.7); opacity: 0; }

      /* ---------- what's happening: one caption banner at a time ---------- */
      .banner {
        position: absolute; right: 128px; top: 84px; max-width: 560px; opacity: 0;
        padding: 24px 32px; border-radius: 34px; background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 22px 44px -14px rgba(59, 46, 37, 0.38), 0 0 0 1px rgba(59, 46, 37, 0.06);
        font-size: 30px; font-weight: 700; line-height: 1.25; color: #3b2e25;
      }

      /* Mia's order, flying from her phone to the waiter's: the homepage's
         orange blob with a bag and the item count */
      #blob { position: absolute; left: 0; top: 0; width: 132px; height: 132px; margin: -66px 0 0 -66px; z-index: 60; opacity: 0; }
      #blob-shape { position: absolute; inset: 0; filter: drop-shadow(0 14px 18px rgba(59, 46, 37, 0.35)); }
      #blob-shape svg.b { position: absolute; inset: -8px; width: 148px; height: 148px; }
      #blob-shape .bag { position: absolute; left: 42px; top: 38px; width: 48px; height: 52px; }
      #blob-shape .count {
        position: absolute; left: 76px; top: 22px; width: 36px; height: 36px; border-radius: 50%;
        background: #f1b52e; border: 3px solid #fff; color: #3b2e25;
        font-size: 19px; font-weight: 800; line-height: 30px; text-align: center;
      }
    </style>
  </head>

ZM2693 829Q2597 829 2525.5 792.5Q2454 756 2414.5 692.5Q2375 629 2375 548Q2375 467 2413.5 403.5Q2452 340 2520 304.5Q2588 269 2673 269Q2753 269 2819 301.5Q2885 334 2924 397Q2963 460 2963 550Q2963 560 2962 573Q2961 586 2960 597H2531V497H2859L2787 525Q2788 488 2773.5 461Q2759 434 2733.5 419Q2708 404 2674 404Q2640 404 2614.5 419Q2589 434 2575 461.5Q2561 489 2561 526V555Q2561 595 2577.5 624Q2594 653 2625 668.5Q2656 684 2699 684Q2739 684 2767.5 672.5Q2796 661 2824 637L2924 741Q2885 784 2828 806.5Q2771 829 2693 829ZM3268 829Q3164 829 3106 777.5Q3048 726 3048 622V157H3238V620Q3238 649 3254 665.5Q3270 682 3295 682Q3329 682 3353 665L3400 798Q3376 814 3341 821.5Q3306 829 3268 829ZM2969 419V278H3362V419ZM3448 820V278H3638V820ZM3543 218Q3491 218 3459 189Q3427 160 3427 117Q3427 74 3459 45Q3491 16 3543 16Q3595 16 3627 43.5Q3659 71 3659 114Q3659 159 3627.5 188.5Q3596 218 3543 218ZM3978 829Q3874 829 3816 777.5Q3758 726 3758 622V157H3948V620Q3948 649 3964 665.5Q3980 682 4005 682Q4039 682 4063 665L4110 798Q4086 814 4051 821.5Q4016 829 3978 829ZM3679 419V278H4072V419ZM4426 829Q4330 829 4258.5 792.5Q4187 756 4147.5 692.5Q4108 629 4108 548Q4108 467 4146.5 403.5Q4185 340 4253 304.5Q4321 269 4406 269Q4486 269 4552 301.5Q4618 334 4657 397Q4696 460 4696 550Q4696 560 4695 573Q4694 586 4693 597H4264V497H4592L4520 525Q4521 488 4506.5 461Q4492 434 4466.5 419Q4441 404 4407 404Q4373 404 4347.5 419Q4322 434 4308 461.5Q4294 489 4294 526V555Q4294 595 4310.5 624Q4327 653 4358 668.5Q4389 684 4432 684Q4472 684 4500.5 672.5Q4529 661 4557 637L4657 741Q4618 784 4561 806.5Q4504 829 4426 829Z"/></svg></div>

        <div id="blob"><div id="blob-shape">
          <svg class="b" viewBox="0 0 200 200"><path transform="translate(100 100)" fill="#F19A33" d="M44.7,-58.3C57.1,-48.7,65.8,-34.4,70.1,-18.6C74.3,-2.7,74.1,14.7,67,29.1C59.9,43.5,45.9,54.8,30.3,62.3C14.7,69.8,-2.6,73.5,-19.6,70.2C-36.6,66.9,-53.3,56.6,-63.6,41.7C-73.9,26.8,-77.8,7.3,-73.6,-9.9C-69.4,-27.1,-57.1,-42,-42.4,-51.3C-27.7,-60.6,-10.6,-64.3,3.6,-68.6C17.8,-72.9,32.3,-67.9,44.7,-58.3Z" /></svg>
          <svg class="bag" viewBox="0 0 24 26" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M4 8h16l-1.2 15H5.2z" /><path d="M8.5 11V6.5a3.5 3.5 0 0 1 7 0V11" /></svg>
          <div class="count">2</div>
        </div></div>

        <!-- banners -->
        <div class="banner" id="b1">Tap the tag</div>
        <div class="banner" id="b2">Menu opens with no app needed</div>
        <div class="banner" id="b3">Orders are added</div>
        <div class="banner" id="b4">Order gets sent to the waiter</div>
        <div class="banner" id="b5">Waiter receives and comes to you to confirm all the order</div>
      </div>
    </div>

    <script>
      if (location.hash === "#embed" || new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");

      gsap.registerPlugin(MotionPathPlugin);
      const tl = gsap.timeline({ paused: true });

      // Phone poses, in rig units. A = where the page's phone sits (start and
      // end of the loop, under the tag). U = lifted clear of the tag.
      // T = touching the tag. B = held up and used, just clear of the tag.
      // OUT/IN = sliding away left / waiting off to the right.
      const A = { x: 0, y: 0, rotation: 0, rotationX: 0, rotationY: 0, scale: 1, opacity: 1 };
      const U = { x: 70, y: -40, rotation: 5, rotationX: 6, rotationY: -10, scale: 0.97, opacity: 1 };
      const T = { x: -196, y: 60, rotation: -9, rotationX: 18, rotationY: 6, scale: 0.85, opacity: 1 };
      const B = { x: 62, y: -10, rotation: 0, rotationX: 0, rotationY: 0, scale: 1, opacity: 1 };
      const OUT = { x: -330, y: 10, rotation: -4, rotationX: 0, rotationY: 24, scale: 0.9, opacity: 0 };
      const IN = { x: 420, y: 10, rotation: 4, rotationX: 0, rotationY: -24, scale: 0.9, opacity: 0 };

      // initial states (frame 0 = frame 21: a dark phone where the page's phone is)
      gsap.set("#gp", { ...A, zIndex: 1 });
      gsap.set("#wp", IN);
      gsap.set("#gp-shadow", { x: 0, y: 0, opacity: 1 });
      gsap.set("#g-dish", { y: 844 });
      gsap.set("#g-order", { clipPath: "inset(0 0 0 100%)" });
      gsap.set("#w-scroll", { y: -420 });
      gsap.set("#w-mia", { opacity: 0, y: -24, scale: 0.96 });
      gsap.set(".banner", { x: -40, y: -46, opacity: 0 });

      // tap a screen point (app CSS px), with a ring
      function tap(x, y, at) {
        tl.set("#touch", { left: x, top: y, scale: 1.25, opacity: 0 }, at - 0.3);
        tl.set("#tring", { left: x, top: y, scale: 1, opacity: 0 }, at - 0.3);
        tl.to("#touch", { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, at - 0.28);
        tl.to("#touch", { scale: 0.82, duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1 }, at);
        tl.fromTo("#tring", { scale: 1, opacity: 0.9 }, { scale: 2.4, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, at);
        tl.to("#touch", { opacity: 0, duration: 0.25, ease: "power1.out" }, at + 0.22);
      }

      // a banner comes in from the top; the one before it drops down and fades
      function banner(next, prev, at) {
        tl.to(next, { x: 0, y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, at);
        if (prev) tl.to(prev, { y: 60, opacity: 0, duration: 0.28, ease: "power2.in" }, at);
      }

      // 1.2 - 2.9  the phone lifts clear of the tag, then comes down onto it
      tl.to("#gp", { ...U, duration: 0.7, ease: "power2.out" }, 1.2);
      tl.set("#gp", { zIndex: 3 }, 1.9);
      tl.to("#gp", { ...T, duration: 1.0, ease: "power2.inOut" }, 1.9);
      tl.to("#gp-shadow", { x: -6, y: -30, opacity: 1.0, duration: 1.0, ease: "power2.inOut" }, 1.9);
      banner("#b1", null, 2.0);
      // the tap: tag glows, three rings ripple out
      tl.to("#tag-glow", { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.9);
      tl.to("#tag-glow", { opacity: 0, duration: 1.1, ease: "power2.in" }, 3.3);
      ["#ring1", "#ring2", "#ring3"].forEach((r, i) => {
        tl.fromTo(r, { scale: 1, opacity: 0.95 }, { scale: 2.3, opacity: 0, duration: 1.4, ease: "power2.out", immediateRender: false }, 2.95 + i * 0.22);
      });

      // 3.9 - 4.9  lifted up to read; the screen wakes on the menu
      tl.to("#gp", { ...B, duration: 1.0, ease: "power3.out" }, 3.9);
      tl.to("#gp-shadow", { x: 0, y: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, 3.9);
      tl.to("#g-off", { opacity: 0, duration: 0.5, ease: "power1.out" }, 4.0);
      tl.fromTo("#g-home", { y: 26 }, { y: 0, duration: 0.8, ease: "power3.out" }, 4.0);
      banner("#b2", "#b1", 4.3);
      tl.set("#gp", { zIndex: 1 }, 4.95);

      // 6.3 - 7.3  (after a read) scroll down to Featured dishes
      tl.to("#g-tall", { y: -560, duration: 1.0, ease: "power2.inOut" }, 6.3);

      // 7.9  tap Sinigang na Hipon; its page slides up
      tap(72, 307, 7.9);
      tl.to("#g-dish", { y: 0, duration: 0.55, ease: "power3.out" }, 8.1);

      // 10.0  Add to order -> "Added" toast
      tap(195, 566, 10.0);
      tl.to("#g-dish-added", { opacity: 1, duration: 0.2, ease: "none" }, 10.1);
      banner("#b3", "#b2", 10.2);

      // 11.0  page closes; order bar shows 1
      tl.to("#g-dish", { y: 844, duration: 0.45, ease: "power2.in" }, 11.0);
      tl.to("#nav1", { opacity: 1, duration: 0.2, ease: "none" }, 11.45);
      tl.to("#nav0", { opacity: 0, duration: 0.2, ease: "none" }, 11.52);

      // 12.1  add a Mango Shake straight from the row; bar shows 2
      tap(317, 704, 12.1);
      tl.to("#nav2", { opacity: 1, duration: 0.2, ease: "none" }, 12.2);
      tl.to("#nav1", { opacity: 0, duration: 0.2, ease: "none" }, 12.27);

      // 13.0  open My order
      tap(308, 804, 13.0);
      tl.to("#g-order", { clipPath: "inset(0 0 0 0%)", duration: 0.5, ease: "power3.out" }, 13.15);

      // 14.7  Send to waiter -> Sent
      tap(210, 802, 14.7);
      tl.to("#g-sent", { opacity: 1, duration: 0.3, ease: "power1.out" }, 14.85);
      banner("#b4", "#b3", 15.0);

      // 16.0 - 17.3  Mia's phone slides away left, the waiter's slides in
      tl.to("#gp", { ...OUT, duration: 1.0, ease: "power2.inOut" }, 16.0);
      tl.to("#wp", { ...B, duration: 1.1, ease: "power3.out" }, 16.2);

      // 16.05 - 17.9  the order pops out of Mia's phone as a blob, does one
      // loop-de-loop over the plate and lands where her card goes on the
      // waiter's phone. Canvas px: (612,470) is Mia's sent list, (624,829) is
      // the waiter's empty slot under Paolo.
      tl.fromTo("#blob", { x: 612, y: 470, scale: 0, opacity: 1 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)", immediateRender: false }, 16.05);
      tl.fromTo("#blob-shape", { scaleX: 0.7, scaleY: 1.3 }, { scaleX: 1, scaleY: 1, duration: 0.35, ease: "elastic.out(1, 0.5)", immediateRender: false }, 16.05);
      tl.to("#blob", {
        duration: 1.3, ease: "power1.inOut",
        motionPath: { path: "M612,470 C690,420 800,400 900,400 C1010,400 1060,290 990,240 C920,190 830,240 860,320 C890,400 1010,430 1010,530 C1010,680 800,790 624,829" },
      }, 16.4);
      // it wobbles as it flies, like something soft
      tl.to("#blob-shape", { scaleX: 1.12, scaleY: 0.9, rotation: 10, duration: 0.325, ease: "sine.inOut", yoyo: true, repeat: 3 }, 16.4);
      // landing: squash flat and melt into the screen
      tl.to("#blob-shape", { scaleX: 1.35, scaleY: 0.6, rotation: 0, duration: 0.12, ease: "power2.out" }, 17.7);
      tl.to("#blob", { scale: 0.3, opacity: 0, duration: 0.25, ease: "power2.in" }, 17.78);

      // 17.5 - 18.4  Mia's order appears where the blob landed, the total updates
      tl.to("#w-bottom", { y: 267, duration: 0.5, ease: "power3.inOut" }, 17.45);
      tl.fromTo("#w-mia", { opacity: 0, y: 0, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, 17.8);
      tl.to("#mia-glow", { opacity: 1, duration: 0.25, ease: "power2.out" }, 17.9);
      tl.to("#mia-glow", { opacity: 0, duration: 0.8, ease: "power2.in" }, 19.0);
      tl.to("#w-foot-new", { opacity: 1, duration: 0.25, ease: "none" }, 17.95);
      banner("#b5", "#b4", 17.85);

      // reset Mia's phone while it is out of sight
      tl.set("#gp", { ...A, opacity: 0, zIndex: 1 }, 18.0);
      tl.set("#g-off", { opacity: 1 }, 18.0);
      tl.set(["#g-sent", "#g-dish-added", "#nav1", "#nav2"], { opacity: 0 }, 18.0);
      tl.set("#nav0", { opacity: 1 }, 18.0);
      tl.set("#g-order", { clipPath: "inset(0 0 0 100%)" }, 18.0);
      tl.set("#g-tall", { y: 0 }, 18.0);

      // 19.7 - 21  the waiter's phone goes dark and settles where Mia's started;
      // the last banner drops away
      tl.to("#wp", { ...A, duration: 1.3, ease: "power2.inOut" }, 19.7);
      tl.to("#w-off", { opacity: 1, duration: 0.6, ease: "power1.in" }, 19.9);
      tl.to("#b5", { y: 60, opacity: 0, duration: 0.5, ease: "power2.in" }, 20.1);

      // On the homepage (?embed): scale the canvas to the frame, then play while
      // it is on screen (looping). Reduced motion gets one still frame (5.5s).
      // The first play starts at 4.9s, with the menu already open on the phone,
      // so a visitor's first look is the product, not a dark screen; every
      // loop after that plays the whole dinner from the tap.
      // HyperFrames' own runtime never sets ?embed, so Studio and renders skip this.
      window.__timelines = window.__timelines || {};
      if (document.documentElement.classList.contains("embed")) {
        const root = document.getElementById("root");
        const fit = () => {
          document.body.style.transformOrigin = "0 0";
          document.body.style.transform = `scale(${innerWidth / Number(root.dataset.width)})`;
        };
        fit();
        addEventListener("resize", fit);
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          tl.seek(5.5);
        } else {
          // hold for the rest of the root duration, then go again
          tl.repeat(-1).repeatDelay(Math.max(0, Number(root.dataset.duration) - tl.duration()));
          let started = false;
          new IntersectionObserver(([e]) => {
            if (e.isIntersecting) { if (!started) tl.seek(4.9); tl.play(); started = true; }
            else if (true && started) tl.pause();
          }).observe(document.documentElement);
        }
      }

      window.__timelines["main"] = tl;
    </script>
